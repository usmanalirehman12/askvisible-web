name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Fails on unused files, exports and dependencies. Added after a cleanup pass found
      # three orphaned files and two dead exports that typecheck and tests both waved through.
      - name: Dead code
        run: npm run deadcode
